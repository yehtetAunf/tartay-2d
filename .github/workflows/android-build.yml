name: Build Tartay 2D Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create TWA project
        run: |
          mkdir android-app
          cd android-app
          bubblewrap init \
            --manifest="https://tartay-2d.yehtetaung7655.workers.dev/manifest.webmanifest" \
            --directory="." \
            --packageId="com.tartay.twod" \
            --name="Tartay 2D" \
            --launcherName="Tartay 2D" \
            --skipPwaValidation

      - name: Build Android app
        working-directory: android-app
        run: bubblewrap build

      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: tartay-2d-android
          path: |
            android-app/*.apk
            android-app/*.aab
          if-no-files-found: error
