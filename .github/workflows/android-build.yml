name: Build Tartay 2D Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" \
            > "$HOME/.bubblewrap/config.json"

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Create TWA project
        run: |
          rm -rf android-app
          mkdir -p android-app
          cd android-app

          yes "" | bubblewrap init \
            --manifest="https://tartay-2d.yehtetaung7655.workers.dev/manifest.json"

      - name: Build Android app
        working-directory: android-app
        run: |
          yes "" | bubblewrap build

      - name: Find Android files
        if: always()
        run: |
          echo "Searching for APK/AAB files..."
          find android-app -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: Upload Android files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tartay-2d-android
          path: |
            android-app/**/*.apk
            android-app/**/*.aab
          if-no-files-found: warn
