<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Tartay 2D</title>

  <link
    rel="stylesheet"
    href="/app.css"
  >
</head>

<body>

<main class="app">

  <!-- TOP HEADER -->
  <header class="top-header">

    <a
      class="back-btn"
      href="/"
      aria-label="Back"
    >
      ‹
    </a>

    <h1>
      Tartay <span>2D</span>
    </h1>

    <a
      class="history-btn"
      href="/history.html"
    >
      ▣ History
    </a>

  </header>


  <!-- LIVE STATUS -->
  <div class="live-row">

    <span class="online">
      ● LIVE
    </span>

  </div>


  <!-- CURRENT RESULT -->
  <section class="current">

    <div
      id="twoD"
      class="current-number"
    >
      --
    </div>

    <div class="updated">

      ◷ Updated =
      <span id="round">
        Waiting for result
      </span>

    </div>

  </section>


  <!-- ROUND LIST -->
  <section
    id="rounds"
    class="rounds"
  ></section>


  <!-- Hidden compatibility fields -->
  <span id="set" hidden>--</span>
  <span id="value" hidden>--</span>

</main>


<script src="/app.js"></script>

</body>
</html>
