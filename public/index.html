<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tartay 2D Login</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:#0f172a;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.card{
width:340px;
background:#1e293b;
padding:25px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,.4);
}
h2{
color:#fff;
text-align:center;
margin-bottom:20px;
}
input{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:8px;
font-size:16px;
}
button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
button:hover{
background:#1d4ed8;
}
#msg{
margin-top:15px;
color:white;
text-align:center;
}
</style>

</head>
<body>

<div class="card">

<h2>Tartay 2D Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="msg"></div>

</div>

<script>
async function login(){

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

const res=await fetch("/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
});

const data=await res.json();

if(data.success){
document.getElementById("msg").innerHTML="✅ Login Successful";
setTimeout(()=>{
location.href="/dashboard.html";
},500);
}else{
document.getElementById("msg").innerHTML="❌ "+data.message;
}

}
</script>

</body>
</html>
