<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020812">
<title>Tartay 2D</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css?v=4.4">
</head>
<body>
<main class="app public-app reference-shell">

  <!-- Exact reference picture is the visual base.
       Dynamic data is overlaid at the same positions. -->
  <a class="history-hotspot" href="/history.html" aria-label="History"></a>

  <section class="hero">
    <span class="online" aria-hidden="true">● LIVE</span>
    <div class="result-mask"></div>
    <div id="twoD" class="big-result">--</div>

    <div class="updated-mask"></div>
    <div id="updatedText" class="updated-text">Updated --</div>

    <div id="preSpinLabel" class="pre-spin-label" hidden>
      <strong id="preSpinNumber">--</strong>
    </div>
  </section>

  <section class="round-table" aria-label="Today rounds">
    <div class="round-head" aria-hidden="true"></div>
    <div id="rounds"></div>
  </section>

</main>
<script src="/app.js?v=4.4"></script>
</body>
</html>
