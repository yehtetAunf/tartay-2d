<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tartay 2D Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

header{
background:#1e293b;
padding:18px;
font-size:22px;
font-weight:bold;
text-align:center;
}

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:.2s;
}

.card:hover{
background:#2563eb;
}

.logout{
position:fixed;
bottom:20px;
right:20px;
padding:12px 20px;
background:red;
color:white;
border:none;
border-radius:8px;
}
</style>
</head>

<body>

<header>
Tartay 2D Admin Dashboard
</header>

<div class="container">

<div class="card">👤 Users</div>

<div class="card">🎯 Results</div>

<div class="card">💰 Bets</div>

<div class="card">📊 Reports</div>

<div class="card">⚙ Settings</div>

</div>

<button class="logout" onclick="location.href='/'">
Logout
</button>

</body>
</html>
