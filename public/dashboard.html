<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tartay 2D Admin</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand">တာတေ 2D Admin</div><div><a class="secondary-button link-btn" href="/user.html">User App</a> <button class="danger-button" onclick="logout()">Logout</button></div></header><main class="page"><section class="summary-grid finance-grid"><article class="summary-card"><span>Total Bets</span><strong id="totalBets">0</strong></article><article class="summary-card"><span>Total Amount</span><strong id="totalAmount">0</strong></article><article class="summary-card"><span>Total Payout</span><strong id="totalPayout">0</strong></article><article class="summary-card"><span>Profit / Loss</span><strong id="profitLoss">0</strong></article><article class="summary-card"><span>Customers</span><strong id="totalCustomers">0</strong></article></section><section class="admin-grid"><article class="panel"><h2>🎯 Result Management</h2><form id="resultForm"><label>Date<input id="resultDate" type="date" required></label><label>Result Time<select id="resultTime" required><option value="">Select time</option><option>5:00 PM</option><option>6:00 PM</option><option>7:00 PM</option><option>8:00 PM</option><option>9:00 PM</option><option>10:00 PM</option><option>11:00 PM</option><option>12:00 AM</option></select></label><label>SET<input id="setValue" placeholder="Example: 13,916.32"></label><label>VALUE<input id="marketValue" placeholder="Example: 302,906.28"></label><label>2D Result<input id="resultNumber" maxlength="2" inputmode="numeric" placeholder="00 - 99" required></label><button class="primary-button" type="submit">Publish Result</button><p id="resultMessage" class="message"></p></form></article><article class="panel"><h2>💰 Bet Entry</h2><form id="betForm"><label>Customer Name<input id="customerName" required></label><label>Phone<input id="phone"></label><label>2D Number<input id="number" maxlength="2" inputmode="numeric" required></label><label>Amount<input id="amount" type="number" min="1" required></label><label>Result Time<select id="betType" required><option value="">Select time</option><option>5:00 PM</option><option>6:00 PM</option><option>7:00 PM</option><option>8:00 PM</option><option>9:00 PM</option><option>10:00 PM</option><option>11:00 PM</option><option>12:00 AM</option></select></label><button id="saveButton" class="primary-button" type="submit">Save Bet</button><p id="formMessage" class="message"></p></form></article></section><article class="panel wide-panel"><div class="panel-heading"><h2>📋 Bet List</h2><button class="secondary-button" onclick="loadBets()">Refresh</button></div><div class="table-wrapper"><table><thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Number</th><th>Amount</th><th>Time</th><th>Status</th><th>Payout</th><th>Created</th></tr></thead><tbody id="betTableBody"></tbody></table></div></article></main><script src="/dashboard.js"></script></body></html>
