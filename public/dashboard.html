<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tartay 2D Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">တာတေ 2D Admin</div>
    <div class="topbar-actions">
      <a class="nav-link" href="/user.html" target="_blank">User App</a>
      <button class="danger-button" type="button" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="page">
    <section class="summary-grid">
      <article class="summary-card"><span>Total Bets</span><strong id="totalBets">0</strong></article>
      <article class="summary-card"><span>Total Amount</span><strong id="totalAmount">0</strong></article>
      <article class="summary-card"><span>Customers</span><strong id="totalCustomers">0</strong></article>
    </section>

    <section class="result-panel panel">
      <div class="panel-heading">
        <div>
          <h2>🎯 Result Management</h2>
          <p class="muted">Admin သတ်မှတ်ထားတဲ့ဂဏန်းကို User App မှာ ချက်ချင်းပြမယ်။</p>
        </div>
        <button class="secondary-button" type="button" onclick="loadResults()">Refresh</button>
      </div>
      <div id="resultGrid" class="result-admin-grid"></div>
      <p id="resultMessage" class="message"></p>
    </section>

    <section class="content-grid">
      <article class="panel">
        <h2>💰 Bet Entry</h2>
        <form id="betForm">
          <label>Customer Name<input id="customerName" type="text" required></label>
          <label>Phone<input id="phone" type="text"></label>
          <label>2D Number<input id="number" type="text" inputmode="numeric" maxlength="2" placeholder="00 - 99" required></label>
          <label>Amount<input id="amount" type="number" min="1" step="1" required></label>
          <label>Result Time
            <select id="betType" required>
              <option value="">Select time</option>
              <option>5:00 PM</option><option>6:00 PM</option><option>7:00 PM</option>
              <option>8:00 PM</option><option>9:00 PM</option><option>10:00 PM</option>
              <option>11:00 PM</option><option>12:00 AM</option>
            </select>
          </label>
          <button id="saveButton" class="primary-button" type="submit">Save Bet</button>
          <p id="formMessage" class="message"></p>
        </form>
      </article>

      <article class="panel">
        <div class="panel-heading">
          <h2>📋 Bet List</h2>
          <button class="secondary-button" type="button" onclick="loadBets()">Refresh</button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>ID</th><th>Customer</th><th>Phone</th><th>Number</th><th>Amount</th><th>Time</th><th>Status</th><th>Created</th></tr>
            </thead>
            <tbody id="betTableBody">
              <tr><td colspan="8" class="empty-row">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script src="/dashboard.js"></script>
</body>
</html>
