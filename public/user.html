<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040f">
  <title>တာတေ 2D</title>
  <link rel="stylesheet" href="/user-v2.css?v=final1">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">တာတေ <strong>2D</strong></div>
      <div id="statusBadge" class="status live">
        <span class="dot"></span>
        <span id="statusText">LIVE</span>
      </div>
    </header>

    <main class="main">
      <section class="hero-card">
        <div class="hero-label">LIVE RESULT</div>

        <div id="bigResult" class="big-result">--</div>

        <div class="market-row">
          <div class="market-box">
            <span>SET</span>
            <strong id="liveSet">--</strong>
          </div>
          <div class="market-box">
            <span>VALUE</span>
            <strong id="liveValue">--</strong>
          </div>
        </div>

        <div class="updated">
          <span class="tiny-clock">◷</span>
          <span id="updatedText">Waiting for result</span>
        </div>
      </section>

      <section class="result-section">
        <div class="section-head">
          <h2>Today Results</h2>
        </div>

        <div id="roundGrid" class="round-grid"></div>
      </section>

      <a class="history-button" href="/history">
        <span>◷</span>
        <span>Result History</span>
      </a>
    </main>
  </div>

  <script src="/user-v2.js?v=final1"></script>
</body>
</html>
