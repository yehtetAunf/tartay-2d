<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>တာတေ 2D Live Result</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="user-app-body">
  <header class="user-header">
    <div>
      <div class="user-brand">တာတေ 2D</div>
      <div class="live-label"><span class="live-dot"></span> Live Result</div>
    </div>
    <button class="secondary-button" type="button" onclick="loadPublicResults()">Refresh</button>
  </header>

  <main class="user-page">
    <section class="hero-result">
      <div class="hero-label">Latest Result</div>
      <div id="latestNumber" class="hero-number">--</div>
      <div id="latestTime" class="hero-time">Waiting for result</div>
      <div id="updatedAt" class="updated-at">Updated: --</div>
    </section>

    <section class="public-result-card">
      <div class="public-card-heading">
        <h2>Today Results</h2>
        <span>5:00 PM – 12:00 AM</span>
      </div>
      <div id="publicResultList" class="public-result-list">
        <div class="empty-row">Loading...</div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a class="active" href="/user.html">🏠<span>Home</span></a>
    <a href="#results">🎯<span>Results</span></a>
    <a href="#history">📜<span>History</span></a>
    <a href="/">👤<span>Admin</span></a>
  </nav>

  <script src="/user.js"></script>
</body>
</html>
