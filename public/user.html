<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02030b">

  <title>တာတေ 2D</title>

  <link rel="stylesheet" href="/user-v2.css">
</head>

<body>

  <div class="app-shell">

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="brand">
        တာတေ <strong>2D</strong>
      </div>

      <div id="statusBadge" class="status live">
        <span class="dot"></span>
        <span id="statusText">LIVE</span>
      </div>

    </header>


    <main class="main">

      <!-- LIVE RESULT -->
      <section class="hero-card">

        <div class="hero-label">
          LIVE RESULT
        </div>

        <div id="bigResult" class="big-result">
          --
        </div>


        <div class="market-row">

          <div>
            <span>SET</span>
            <strong id="liveSet">--</strong>
          </div>

          <div>
            <span>VALUE</span>
            <strong id="liveValue">--</strong>
          </div>

        </div>


        <div class="updated">
          <span id="updatedText">
            Waiting for result
          </span>
        </div>

      </section>


      <!-- TODAY RESULTS -->
      <section class="result-section">

        <div class="section-head">

          <h2>Today Results</h2>

          <button
            id="refreshBtn"
            type="button"
            aria-label="Refresh results">
            Refresh
          </button>

        </div>


        <!--
          user-v2.js က
          05:00 PM
          06:00 PM
          07:00 PM
          08:00 PM
          09:00 PM
          10:00 PM
          11:00 PM
          12:00 AM
          Cards 8 ခုကို ဒီထဲထည့်မယ်
        -->
        <div
          id="roundGrid"
          class="round-grid">
        </div>

      </section>


      <!-- RESULT HISTORY -->
      <section class="history-section">

        <a
          href="/history.html"
          class="history-button">

          <span>◷</span>
          <span>Result History</span>

        </a>

      </section>

    </main>

  </div>


  <script src="/user-v2.js"></script>

</body>
</html>
