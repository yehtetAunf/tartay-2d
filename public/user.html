<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1428">
  <title>တာတေ 2D</title>
  <link rel="stylesheet" href="/user-v2.css?v=jordan8-final">
</head>
<body>
  <div class="video-bg" aria-hidden="true">
<div class="video-shade"></div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">တာတေ <strong>2D</strong></div>
      <a class="top-history" href="/history.html"><span>▣</span> History</a>
    </header>

    <main class="main">
      <section class="live-panel">
        <div class="live-row">
          <div id="statusBadge" class="status live"><span class="dot"></span><span id="statusText">LIVE</span></div>
        </div>
        <div id="bigResult" class="big-result">--</div>
        <div class="updated">◷ <b>Updated =</b> <span id="updatedText">Waiting for result</span></div>
        <div class="market-summary">
          <div><small>SET</small><strong id="liveSet">--</strong></div>
          <div><small>VALUE</small><strong id="liveValue">--</strong></div>
        </div>
      </section>

      <section class="results-wrap">
        <div id="roundGrid" class="round-list"></div>
      </section>
    </main>
  </div>
  <script src="/user-v2.js?v=jordan8-final"></script>
</body>
</html>
