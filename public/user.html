<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>တာတေ 2D</title><link rel="stylesheet" href="/user-v2.css"></head>
<body class="u-body"><header class="u-header"><div class="u-title">တာတေ <b>2D</b></div><div class="header-actions"><span id="balancePill" class="balance-pill hidden">Balance <b id="balanceText">0</b></span><button id="logoutBtn" class="history-btn hidden">Logout</button><a class="history-btn" href="/history.html">▣ History</a></div></header>
<main class="u-main">
<section id="loginPanel" class="account-card"><h2>Customer Login</h2><input id="loginUsername" placeholder="Username" autocomplete="username"><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" class="primary-btn">Login</button><div id="loginMessage" class="u-message"></div></section>
<section id="betPanel" class="account-card hidden"><div class="account-row"><div><small>Account</small><strong id="customerName">-</strong></div><div class="wallet-big"><small>Wallet Balance</small><strong id="walletBalance">0</strong></div></div><h2>Place 2D Bet</h2><label>Result Time</label><select id="betTime"><option value="">Select time</option><option>5:00 PM</option><option>6:00 PM</option><option>7:00 PM</option><option>8:00 PM</option><option>9:00 PM</option><option>10:00 PM</option><option>11:00 PM</option><option>12:00 AM</option></select><label>2D Number</label><input id="betNumber" inputmode="numeric" maxlength="2" placeholder="00 - 99"><label>Amount</label><input id="betAmount" inputmode="numeric" placeholder="Example: 500"><button id="betBtn" class="primary-btn">Confirm Bet</button><div id="betMessage" class="u-message"></div><h3>My Bets</h3><div id="myBets" class="my-bets">No bets yet.</div></section>
<section class="hero"><div class="latest" id="latestNumber">--</div><div class="updated">◷ Updated = <span id="updatedText">--</span> <i>✓</i></div></section><section id="resultCards" class="cards"></section></main>
<nav class="bottom-nav"><a class="active" href="/user.html">⌂<span>Home</span></a><a href="#results">◎<span>Results</span></a><a href="/history.html">▤<span>History</span></a><a href="/">♟<span>Admin</span></a></nav><script src="/user-v2.js"></script></body></html>
