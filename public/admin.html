<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tartay 2D Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#06172a;
  color:#fff;
  min-height:100vh;
}

.container{
  width:92%;
  max-width:520px;
  margin:auto;
  padding:30px 0;
}

.logo-small{
  color:#7ea9d8;
  font-size:12px;
  letter-spacing:1.5px;
  margin-bottom:5px;
}

h1{
  font-size:26px;
  margin-bottom:25px;
}

.card{
  background:#0d2947;
  border:1px solid #1c4772;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  color:#9db4cb;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  padding:13px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #315579;
  background:#071b30;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus,
select:focus{
  border-color:#1677ff;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login-btn{
  background:#1677ff;
}

.schedule-btn{
  background:#1769aa;
  margin-top:5px;
}

.publish-btn{
  background:#29915c;
  margin-top:12px;
}

.secondary{
  background:#173b5f;
  margin-top:10px;
}

.hidden{
  display:none !important;
}

.status{
  margin-top:15px;
  text-align:center;
  font-size:14px;
  min-height:20px;
}

.success{
  color:#58d69d;
}

.error{
  color:#ff6b6b;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.badge{
  background:#123b35;
  color:#65e2aa;
  border-radius:20px;
  padding:7px 11px;
  font-size:11px;
}

.result-preview{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  letter-spacing:5px;
  padding:10px 0 20px;
}

.section-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:18px;
}

.auto-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:3px 0 18px;
  color:#fff;
  font-size:15px;
}

.auto-row input{
  width:20px;
  height:20px;
  margin:0;
}

.auto-row label{
  margin:0;
  color:#fff;
  font-size:15px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">

  <div class="logo-small">
    TARTAY 2D
  </div>

  <h1>Admin Login</h1>

  <div class="card">

    <label for="password">
      Admin Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter admin password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="login-btn"
      type="button"
      onclick="login()"
    >
      Login
    </button>

    <div
      id="loginStatus"
      class="status"
    ></div>

  </div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <div class="topbar">

    <div>
      <div class="logo-small">
        TARTAY 2D
      </div>

      <h1 style="margin-bottom:0;">
        Admin
      </h1>
    </div>

    <div class="badge">
      ● ONLINE
    </div>

  </div>


  <div class="card">

    <div class="section-title">
      Set 2D Result
    </div>


    <label for="round">
      Round
    </label>

    <select id="round">
      <option value="05:00 PM">05:00 PM</option>
      <option value="06:00 PM">06:00 PM</option>
      <option value="07:00 PM">07:00 PM</option>
      <option value="08:00 PM">08:00 PM</option>
      <option value="09:00 PM">09:00 PM</option>
      <option value="10:00 PM">10:00 PM</option>
      <option value="11:00 PM">11:00 PM</option>
      <option value="12:00 AM">12:00 AM</option>
    </select>


    <label for="result2d">
      2D Result
    </label>

    <input
      id="result2d"
      type="text"
      inputmode="numeric"
      maxlength="2"
      placeholder="Example: 25"
      oninput="previewResult()"
    >


    <div
      id="resultPreview"
      class="result-preview"
    >
      --
    </div>


    <label for="setValue">
      SET
    </label>

    <input
      id="setValue"
      type="text"
      placeholder="SET value"
    >


    <label for="valueValue">
      VALUE
    </label>

    <input
      id="valueValue"
      type="text"
      placeholder="VALUE"
    >


    <div class="auto-row">

      <input
        id="autoPublish"
        type="checkbox"
        checked
      >

      <label for="autoPublish">
        Auto publish
      </label>

    </div>


    <button
      id="scheduleBtn"
      class="schedule-btn"
      type="button"
      onclick="saveSchedule()"
    >
      Save Schedule
    </button>


    <button
      id="publishBtn"
      class="publish-btn"
      type="button"
      onclick="publishNow()"
    >
      Publish Now
    </button>


    <div
      id="saveStatus"
      class="status"
    ></div>

  </div>


  <button
    class="secondary"
    type="button"
    onclick="logout()"
  >
    Logout
  </button>

</div>

</div>


<script>

let adminToken = "";


/* ========================================
   RESULT PREVIEW
======================================== */

function previewResult(){

  const input =
    document.getElementById(
      "result2d"
    );

  const value =
    input.value
      .replace(/\D/g,"")
      .slice(0,2);

  input.value = value;

  document
    .getElementById(
      "resultPreview"
    )
    .textContent =
      value || "--";
}


/* ========================================
   LOGIN
======================================== */

async function login(){

  const passwordInput =
    document.getElementById(
      "password"
    );

  const password =
    passwordInput.value.trim();

  const status =
    document.getElementById(
      "loginStatus"
    );

  const button =
    document.getElementById(
      "loginBtn"
    );


  if(!password){

    status.textContent =
      "Please enter password";

    status.className =
      "status error";

    return;
  }


  button.disabled = true;

  status.textContent =
    "Checking...";

  status.className =
    "status";


  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              password
            })
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      status.textContent =
        data.error ||
        "Invalid password";

      status.className =
        "status error";

      return;
    }


    if(!data.token){

      status.textContent =
        "Login token missing";

      status.className =
        "status error";

      return;
    }


    adminToken =
      data.token;


    sessionStorage.setItem(
      "tartay_admin_token",
      adminToken
    );


    passwordInput.value = "";


    showDashboard();


  }catch(error){

    console.error(
      "Login error:",
      error
    );

    status.textContent =
      "Login connection error";

    status.className =
      "status error";

  }finally{

    button.disabled = false;

  }
}


/* ========================================
   SHOW DASHBOARD
======================================== */

function showDashboard(){

  document
    .getElementById(
      "loginPage"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "dashboard"
    )
    .classList
    .remove("hidden");
}


/* ========================================
   GET FORM DATA
======================================== */

function getResultData(){

  return {

    round_time:
      document
        .getElementById(
          "round"
        ).value,

    result_2d:
      document
        .getElementById(
          "result2d"
        ).value.trim(),

    set_value:
      document
        .getElementById(
          "setValue"
        ).value.trim(),

    value_value:
      document
        .getElementById(
          "valueValue"
        ).value.trim(),

    auto_publish:
      document
        .getElementById(
          "autoPublish"
        ).checked

  };
}


/* ========================================
   VALIDATE
======================================== */

function validateResult(data){

  const status =
    document.getElementById(
      "saveStatus"
    );


  if(
    !/^\d{2}$/.test(
      data.result_2d
    )
  ){

    status.textContent =
      "2D result must be exactly 2 digits.";

    status.className =
      "status error";

    return false;
  }


  return true;
}


/* ========================================
   SAVE SCHEDULE
======================================== */

async function saveSchedule(){

  const data =
    getResultData();


  if(
    !validateResult(data)
  ){
    return;
  }


  await sendResult(
    data,
    "schedule"
  );
}


/* ========================================
   PUBLISH NOW
======================================== */

async function publishNow(){

  const data =
    getResultData();


  if(
    !validateResult(data)
  ){
    return;
  }


  /*
    IMPORTANT:
    Worker v2.4.0 expects "now"
  */

  await sendResult(
    data,
    "now"
  );
}


/* ========================================
   SEND RESULT
======================================== */

async function sendResult(
  data,
  mode
){

  const status =
    document.getElementById(
      "saveStatus"
    );

  const scheduleBtn =
    document.getElementById(
      "scheduleBtn"
    );

  const publishBtn =
    document.getElementById(
      "publishBtn"
    );


  if(!adminToken){

    status.textContent =
      "Session expired. Please login again.";

    status.className =
      "status error";

    logout();

    return;
  }


  scheduleBtn.disabled = true;
  publishBtn.disabled = true;


  status.textContent =
    mode === "schedule"
      ? "Saving schedule..."
      : "Publishing...";

  status.className =
    "status";


  try{

    const response =
      await fetch(
        "/api/admin/result",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${adminToken}`
          },

          body:
            JSON.stringify({
              ...data,
              publish_mode:mode
            })
        }
      );


    let result = {};

    try{
      result =
        await response.json();
    }catch{
      result = {};
    }


    if(
      response.status === 401
    ){

      sessionStorage.removeItem(
        "tartay_admin_token"
      );

      adminToken = "";

      document
        .getElementById(
          "dashboard"
        )
        .classList
        .add("hidden");


      document
        .getElementById(
          "loginPage"
        )
        .classList
        .remove("hidden");


      status.textContent =
        "Session expired. Please login again.";

      status.className =
        "status error";

      return;
    }


    if(
      !response.ok ||
      !result.success
    ){

      status.textContent =
        result.error ||
        "Operation failed";

      status.className =
        "status error";

      return;
    }


    const round =
      data.round_time;


    if(
      mode === "schedule"
    ){

      status.textContent =
        `${round} Round သိမ်းခြင်းအောင်မြင်ပါတယ် ✓`;

    }else{

      status.textContent =
        `${round} Round ထုတ်ပြခြင်းအောင်မြင်ပါတယ် ✓`;

    }


    status.className =
      "status success";


  }catch(error){

    console.error(
      "Save error:",
      error
    );

    status.textContent =
      "Connection error";

    status.className =
      "status error";

  }finally{

    scheduleBtn.disabled = false;
    publishBtn.disabled = false;

  }
}


/* ========================================
   LOGOUT
======================================== */

function logout(){

  adminToken = "";

  sessionStorage.removeItem(
    "tartay_admin_token"
  );


  document
    .getElementById(
      "dashboard"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "loginPage"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "loginStatus"
    )
    .textContent = "";


  document
    .getElementById(
      "saveStatus"
    )
    .textContent = "";
}


/* ========================================
   ENTER KEY LOGIN
======================================== */

document
  .getElementById(
    "password"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        login();

      }

    }
  );


/* ========================================
   RESTORE SESSION
======================================== */

const savedToken =
  sessionStorage.getItem(
    "tartay_admin_token"
  );


if(savedToken){

  adminToken =
    savedToken;

  showDashboard();

}

</script>

</body>
</html>
