<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06172a"><title>Tartay 2D Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#06172a;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(94%,620px);margin:auto;padding:24px 0 50px}.muted{color:#8fa8c1}.card{background:#0d2947;border:1px solid #1c4772;border-radius:16px;padding:18px;margin-bottom:14px}h1{margin:2px 0 20px}.top{display:flex;align-items:center;justify-content:space-between}.badge{color:#65e2aa;background:#123b35;border-radius:20px;padding:7px 10px;font-size:11px}label{display:block;color:#9db4cb;font-size:12px;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid #315579;background:#071b30;color:#fff;border-radius:10px;padding:12px;font-size:14px}button,.button{display:block;width:100%;border:0;border-radius:10px;padding:13px;color:#fff;font-weight:800;background:#1769aa;margin-top:10px;text-align:center;text-decoration:none;cursor:pointer}.green{background:#29915c}.red{background:#9e3b4a}.purple{background:#6546b9}.gray{background:#173b5f}.hidden{display:none!important}.status{text-align:center;min-height:20px;margin-top:12px;font-size:13px}.success{color:#58d69d}.error{color:#ff7f7f}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:9px;margin:14px 0}.check input{width:20px;height:20px}.check label{margin:0;color:#fff;font-size:14px}.preview{text-align:center;color:#ffc928;font-size:50px;font-weight:900}.round-list{display:grid;gap:7px}.round-item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px;padding:10px;border:1px solid #21496f;border-radius:10px}.round-item strong{color:#ffc928}.tiny{width:auto;margin:0;padding:8px 10px;font-size:11px}.logs{max-height:260px;overflow:auto;white-space:pre-wrap;background:#06172a;border-radius:10px;padding:10px;color:#cbd7e5;font:11px ui-monospace,monospace}@media(max-width:420px){.two{grid-template-columns:1fr}.round-item{grid-template-columns:1fr auto}.round-item .tiny:last-child{grid-column:1/-1}}</style></head><body><main class="wrap"><section id="login"><small class="muted">TARTAY 2D</small><h1>Admin Login</h1><div class="card"><label>Password</label><input id="password" type="password"><button id="loginBtn">Login</button><div id="loginMsg" class="status"></div></div></section><section id="dash" class="hidden"><div class="top"><div><small class="muted">TARTAY 2D</small><h1>Admin</h1></div><span class="badge">● ONLINE</span></div><div class="card"><h3>Set 2D Result</h3><label>Round</label><select id="round"></select><label>2D Result</label><input id="result" inputmode="numeric" maxlength="2" placeholder="25"><div id="preview" class="preview">--</div><div class="two"><div><label>SET</label><input id="setValue"></div><div><label>VALUE</label><input id="valueValue"></div></div><div class="check"><input id="autoPublish" type="checkbox" checked><label for="autoPublish">Auto publish</label></div><div class="two"><button id="saveBtn">Save Schedule</button><button id="publishBtn" class="green">Publish Now</button></div><div id="saveMsg" class="status"></div></div><div class="card"><h3>Today Rounds</h3><div id="roundList" class="round-list"></div></div><div class="card"><h3>Backup / Restore</h3><div class="two"><button id="backupBtn" class="purple">Download Backup</button><label class="button gray" for="restoreFile">Choose Backup<input id="restoreFile" type="file" accept=".json,application/json" hidden></label></div><label>Restore Mode</label><select id="restoreMode"><option value="merge">Merge</option><option value="replace">Replace app_results only</option></select><button id="restoreBtn" class="red">Restore Selected Backup</button><div id="backupMsg" class="status"></div></div><div class="card"><h3>Logs</h3><div class="two"><button id="adminLogs" class="gray">Admin Logs</button><button id="errorLogs" class="gray">Error Logs</button></div><div id="logBox" class="logs">Log မဖွင့်ရသေးပါ</div></div><button id="logoutBtn" class="gray">Logout</button></section></main><script>
const ROUNDS=["05:00 PM","06:00 PM","07:00 PM","08:00 PM","09:00 PM","10:00 PM","11:00 PM","12:00 AM"];let token=sessionStorage.getItem('tartay_admin_token')||'',backupData=null;const $=id=>document.getElementById(id);$('round').innerHTML=ROUNDS.map(x=>`<option>${x}</option>`).join('');function msg(id,text,ok=false){$(id).textContent=text;$(id).className='status '+(ok?'success':'error')}function auth(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}function showDash(){ $('login').classList.add('hidden');$('dash').classList.remove('hidden');loadState()}function logout(){token='';sessionStorage.removeItem('tartay_admin_token');location.reload()}$('result').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,2);$('preview').textContent=e.target.value||'--'};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('loginBtn').onclick=async()=>{try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok||!d.success)return msg('loginMsg',d.error||'Login failed');token=d.token;sessionStorage.setItem('tartay_admin_token',token);showDash()}catch(e){msg('loginMsg','Connection error')}};function form(){return{round_time:$('round').value,result_2d:$('result').value,set_value:$('setValue').value.trim(),value_value:$('valueValue').value.trim(),auto_publish:$('autoPublish').checked}}async function send(mode){const d=form();if(!/^\d{2}$/.test(d.result_2d))return msg('saveMsg','2D result must be exactly 2 digits.');try{const r=await fetch('/api/admin/result',{method:'POST',headers:auth(),body:JSON.stringify({...d,publish_mode:mode})}),x=await r.json();if(r.status===401)return logout();if(!r.ok||!x.success)return msg('saveMsg',x.error||'Operation failed');msg('saveMsg',mode==='now'?`${d.round_time} Round ထုတ်ပြခြင်းအောင်မြင်ပါတယ် ✓`:`${d.round_time} Round သိမ်းခြင်းအောင်မြင်ပါတယ် ✓`,true);loadState()}catch(e){msg('saveMsg','Connection error')}}$('saveBtn').onclick=()=>send('schedule');$('publishBtn').onclick=()=>send('now');$('logoutBtn').onclick=logout;async function unpublish(round){try{const r=await fetch('/api/admin/unpublish',{method:'POST',headers:auth(),body:JSON.stringify({round_time:round})}),d=await r.json();if(!r.ok||!d.success)return msg('saveMsg',d.error||'Unpublish failed');msg('saveMsg',`${round} Round ကို User ဘက်မှ ဖျောက်ထားပါတယ် ✓`,true);loadState()}catch(e){msg('saveMsg','Connection error')}}async function loadState(){try{const r=await fetch('/api/admin/state?t='+Date.now(),{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();if(r.status===401)return logout();const map=new Map((d.results||[]).map(x=>[x.round_time,x]));$('roundList').innerHTML=ROUNDS.map(t=>{const x=map.get(t);return `<div class="round-item"><span>${t} <strong>${x?.result_2d||'--'}</strong><br><small class="muted">${x?((x.publish_mode||'schedule')+' / Auto '+Number(x.auto_publish??1)):'No data'}</small></span><button class="tiny gray" onclick="editRound('${t}')">Edit</button><button class="tiny red" onclick="unpublish('${t}')">Unpublish</button></div>`}).join('');window.__state=map}catch(e){}}window.editRound=t=>{const x=window.__state?.get(t);$('round').value=t;if(x){$('result').value=x.result_2d||'';$('preview').textContent=x.result_2d||'--';$('setValue').value=x.set_value||'';$('valueValue').value=x.value_value||'';$('autoPublish').checked=Number(x.auto_publish??1)===1}};$('backupBtn').onclick=async()=>{try{const r=await fetch('/api/admin/backup',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error('Backup failed');const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tartay-2d-backup.json';a.click();URL.revokeObjectURL(a.href);msg('backupMsg','Backup download အောင်မြင်ပါတယ် ✓',true)}catch(e){msg('backupMsg','Backup failed')}};$('restoreFile').onchange=async e=>{try{backupData=JSON.parse(await e.target.files[0].text());msg('backupMsg','Backup file ready ✓',true)}catch{backupData=null;msg('backupMsg','Invalid JSON file')}};$('restoreBtn').onclick=async()=>{if(!backupData)return msg('backupMsg','Backup file ရွေးပါ');if(!confirm('Restore လုပ်မှာ သေချာပါသလား?'))return;try{const r=await fetch('/api/admin/restore',{method:'POST',headers:auth(),body:JSON.stringify({backup:backupData,mode:$('restoreMode').value})}),d=await r.json();if(!r.ok||!d.success)return msg('backupMsg',d.error||'Restore failed');msg('backupMsg',`Restore အောင်မြင်ပါတယ် (${d.rows} rows) ✓`,true);loadState()}catch{msg('backupMsg','Restore connection error')}};async function logs(type){try{const r=await fetch('/api/admin/logs?type='+type,{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();$('logBox').textContent=(d.logs||[]).map(x=>`#${x.id} ${x.created_at}\n${x.action||x.message}\n${x.details||x.context||''}`).join('\n\n')||'No logs'}catch{$('logBox').textContent='Unable to load logs'}}$('adminLogs').onclick=()=>logs('admin');$('errorLogs').onclick=()=>logs('error');if(token)showDash();
</script></body></html>
