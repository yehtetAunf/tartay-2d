<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tartay 2D Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #06172a;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 520px;
      margin: auto;
      padding: 30px 0;
    }

    .logo-small {
      color: #7ea9d8;
      font-size: 12px;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 25px;
    }

    .card {
      background: #0d2947;
      border: 1px solid #1c4772;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #9db4cb;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #315579;
      background: #071b30;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #1677ff;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #173b5f;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      min-height: 18px;
    }

    .success {
      color: #58d69d;
    }

    .error {
      color: #ff6b6b;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      background: #123b35;
      color: #65e2aa;
      border-radius: 20px;
      padding: 7px 11px;
      font-size: 11px;
    }

    .result-preview {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 5px;
      padding: 10px 0 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN PAGE -->
  <div id="loginPage">

    <div class="logo-small">
      TARTAY 2D
    </div>

    <h1>Admin Login</h1>

    <div class="card">

      <label for="password">
        Admin Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter admin password"
        autocomplete="current-password"
      >

      <button
        id="loginBtn"
        type="button"
        onclick="login()"
      >
        Login
      </button>

      <div
        id="loginStatus"
        class="status"
      ></div>

    </div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div
    id="dashboard"
    class="hidden"
  >

    <div class="topbar">

      <div>

        <div class="logo-small">
          TARTAY 2D
        </div>

        <h1 style="margin-bottom:0;">
          Admin
        </h1>

      </div>

      <div class="badge">
        ● ONLINE
      </div>

    </div>


    <!-- RESULT FORM -->
    <div class="card">

      <div class="section-title">
        Set 2D Result
      </div>


      <label for="round">
        Round
      </label>

      <select id="round">

        <option value="05:00 PM">
          05:00 PM
        </option>

        <option value="06:00 PM">
          06:00 PM
        </option>

        <option value="07:00 PM">
          07:00 PM
        </option>

        <option value="08:00 PM">
          08:00 PM
        </option>

        <option value="09:00 PM">
          09:00 PM
        </option>

        <option value="10:00 PM">
          10:00 PM
        </option>

        <option value="11:00 PM">
          11:00 PM
        </option>

        <option value="12:00 AM">
          12:00 AM
        </option>

      </select>


      <label for="result2d">
        2D Result
      </label>

      <input
        id="result2d"
        type="text"
        inputmode="numeric"
        maxlength="2"
        placeholder="Example: 25"
        oninput="previewResult()"
      >


      <div
        id="resultPreview"
        class="result-preview"
      >
        --
      </div>


      <label for="setValue">
        SET
      </label>

      <input
        id="setValue"
        type="text"
        placeholder="SET value"
      >


      <label for="valueValue">
        VALUE
      </label>

      <input
        id="valueValue"
        type="text"
        placeholder="VALUE"
      >


      <button
        id="saveBtn"
        type="button"
        onclick="saveResult()"
      >
        Save Result
      </button>


      <div
        id="saveStatus"
        class="status"
      ></div>

    </div>


    <button
      class="secondary"
      type="button"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>


<script>

let adminToken = "";


/* ================================
   RESULT PREVIEW
================================ */

function previewResult() {

  const input =
    document.getElementById("result2d");

  const value =
    input.value
      .replace(/\D/g, "")
      .slice(0, 2);

  input.value = value;

  document
    .getElementById("resultPreview")
    .textContent =
      value || "--";
}


/* ================================
   LOGIN
================================ */

async function login() {

  const passwordInput =
    document.getElementById("password");

  const password =
    passwordInput.value.trim();

  const status =
    document.getElementById("loginStatus");

  const button =
    document.getElementById("loginBtn");


  if (!password) {

    status.textContent =
      "Please enter password";

    status.className =
      "status error";

    return;
  }


  button.disabled = true;

  status.textContent =
    "Checking...";

  status.className =
    "status";


  try {

    const response =
      await fetch("/api/admin/login", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          password: password
        })

      });


    let data = {};

    try {

      data =
        await response.json();

    } catch (e) {

      data = {};

    }


    if (
      !response.ok ||
      !data.success
    ) {

      status.textContent =
        data.error ||
        "Invalid password";

      status.className =
        "status error";

      return;
    }


    /*
      New API:
      Login should return token.

      Fallback included for current
      backend compatibility.
    */

    adminToken =
      data.token ||
      password;


    sessionStorage.setItem(
      "tartay_admin_token",
      adminToken
    );


    status.textContent =
      "Login successful ✓";

    status.className =
      "status success";


    passwordInput.value = "";


    document
      .getElementById("loginPage")
      .classList
      .add("hidden");


    document
      .getElementById("dashboard")
      .classList
      .remove("hidden");


  } catch (error) {

    console.error(
      "Login error:",
      error
    );

    status.textContent =
      "Login connection error";

    status.className =
      "status error";

  } finally {

    button.disabled = false;

  }

}


/* ================================
   SAVE RESULT
================================ */

async function saveResult() {

  const round =
    document
      .getElementById("round")
      .value;


  const result2d =
    document
      .getElementById("result2d")
      .value
      .trim();


  const setValue =
    document
      .getElementById("setValue")
      .value
      .trim();


  const valueValue =
    document
      .getElementById("valueValue")
      .value
      .trim();


  const status =
    document.getElementById(
      "saveStatus"
    );


  const button =
    document.getElementById(
      "saveBtn"
    );


  if (!adminToken) {

    status.textContent =
      "Admin session expired. Please login again.";

    status.className =
      "status error";

    logout();

    return;
  }


  if (!/^\d{2}$/.test(result2d)) {

    status.textContent =
      "2D result must be exactly 2 digits.";

    status.className =
      "status error";

    return;
  }


  button.disabled = true;

  status.textContent =
    "Saving...";

  status.className =
    "status";


  try {

    const response =
      await fetch(
        "/api/admin/result",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              adminToken,

            /*
              Compatibility with
              current Tartay backend
            */

            "X-Admin-Password":
              adminToken

          },

          body:
            JSON.stringify({

              round_time:
                round,

              result_2d:
                result2d,

              set_value:
                setValue,

              value_value:
                valueValue

            })

        }
      );


    let data = {};

    try {

      data =
        await response.json();

    } catch (e) {

      data = {};

    }


    if (response.status === 401) {

      status.textContent =
        "Session expired. Please login again.";

      status.className =
        "status error";


      sessionStorage.removeItem(
        "tartay_admin_token"
      );


      adminToken = "";


      setTimeout(
        logout,
        1000
      );

      return;
    }


    if (
      !response.ok ||
      !data.success
    ) {

      status.textContent =
        data.error ||
        "Save failed";

      status.className =
        "status error";

      return;
    }


    status.textContent =
      "Result saved successfully ✓";

    status.className =
      "status success";


    /*
      Clear fields after successful save
    */

    document
      .getElementById("result2d")
      .value = "";


    document
      .getElementById("setValue")
      .value = "";


    document
      .getElementById("valueValue")
      .value = "";


    document
      .getElementById(
        "resultPreview"
      )
      .textContent = "--";


  } catch (error) {

    console.error(
      "Save error:",
      error
    );


    status.textContent =
      "Connection error";

    status.className =
      "status error";


  } finally {

    button.disabled = false;

  }

}


/* ================================
   LOGOUT
================================ */

function logout() {

  adminToken = "";


  sessionStorage.removeItem(
    "tartay_admin_token"
  );


  document
    .getElementById("dashboard")
    .classList
    .add("hidden");


  document
    .getElementById("loginPage")
    .classList
    .remove("hidden");


  document
    .getElementById("password")
    .value = "";


  document
    .getElementById("loginStatus")
    .textContent = "";


  document
    .getElementById("saveStatus")
    .textContent = "";

}


/* ================================
   ENTER KEY LOGIN
================================ */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        login();

      }

    }
  );


/* ================================
   RESTORE ADMIN SESSION
================================ */

const savedToken =
  sessionStorage.getItem(
    "tartay_admin_token"
  );


if (savedToken) {

  adminToken =
    savedToken;


  document
    .getElementById("loginPage")
    .classList
    .add("hidden");


  document
    .getElementById("dashboard")
    .classList
    .remove("hidden");

}

</script>

</body>
  </html>
