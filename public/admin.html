<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>တာတေ 2D Admin</title><link rel="stylesheet" href="/style.css"><style>input,button{padding:11px;border-radius:9px;border:1px solid #33456e;background:#081127;color:white}button{background:#2563eb}.row{display:grid;grid-template-columns:90px 1fr 1fr 70px 75px;gap:5px;margin:7px 0}.key{width:100%;margin:10px 0}@media(max-width:520px){.row{grid-template-columns:1fr 1fr}.row strong{grid-column:1/-1}}</style></head><body><main class="app"><header><b>တာတေ <i>2D</i> Admin</b><a href="/" style="color:white">User App</a></header><input class="key" id="key" type="password" placeholder="Admin Key"><button onclick="load()">Load Admin</button><section id="rows"></section></main><script>let key=document.querySelector('#key'),rows=document.querySelector('#rows');key.value=localStorage.adminKey||'';async function api(path,opt={}){localStorage.adminKey=key.value;opt.headers={...(opt.headers||{}),'x-admin-key':key.value,'content-type':'application/json'};let r=await fetch(path,opt),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}async function load(){try{let s=await api('/api/admin/state');rows.innerHTML=s.rounds.map((r,i)=>`<div class="row"><strong>${r.time}</strong><input id="s${i}" placeholder="SET" value="${r.set||''}"><input id="v${i}" placeholder="VALUE" value="${r.value||''}"><input id="r${i}" maxlength="2" placeholder="2D" value="${r.result||''}"><button onclick="pub(${i})">Save</button></div>`).join('')}catch(e){alert(e.message)}}async function pub(i){try{await api('/api/admin/round',{method:'POST',body:JSON.stringify({index:i,set:document.querySelector('#s'+i).value,value:document.querySelector('#v'+i).value,result:document.querySelector('#r'+i).value})});alert('Saved. Result will show at its scheduled time.');load()}catch(e){alert(e.message)}}load()</script></body></html>
