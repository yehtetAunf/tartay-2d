<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tartay 2D Admin</title>
<link rel="stylesheet" href="/app.css?v=6.15">
</head>
<body class="admin8-page">
<main class="admin8">
  <h1>Tartay <span>2D</span> Admin</h1>

  <section id="loginBox">
    <input id="password" type="password" placeholder="Admin password">
    <button id="loginBtn">Login</button>
    <p id="loginMsg"></p>
  </section>

  <section id="editor" hidden>
    <section class="today-result-panel">
      <h2>Today Round Result</h2>
      <p class="today-help">SET / VALUE ထည့်ပါ။ 2D ကို အလိုအလျောက်တွက်ပေးပါမယ်။</p>
      <label>Round
        <select id="todayRound">
          <option>05:00 PM</option><option>06:00 PM</option><option>07:00 PM</option><option>08:00 PM</option>
          <option>09:00 PM</option><option>10:00 PM</option><option>11:00 PM</option><option>12:00 AM</option>
        </select>
      </label>
      <div class="today-fields">
        <label>SET<input id="todaySet" inputmode="decimal" placeholder="1367.42"></label>
        <label>VALUE<input id="todayValue" inputmode="decimal" placeholder="56789.81"></label>
        <label>2D<input id="today2D" readonly placeholder="--"></label>
      </div>
      <label class="auto-publish-row"><input id="autoPublish" type="checkbox" checked> Auto Publish</label>
      <div class="publish-controls">
        <button id="saveSchedule" type="button" class="schedule-btn">Save Schedule</button>
        <button id="publishToday" type="button" class="publish-btn">Publish Now</button>
        <button id="undoPublish" type="button" class="undo-btn">Undo Publish</button>
      </div>
      <p id="todayMsg"></p>
    </section>

    <h2 class="history-admin-title">History / Date Results</h2>
    <div class="admin-date-row">
      <label class="admin-date-label">Result Date
        <input id="resultDate" type="date">
      </label>
      <button id="loadDate">Load Date</button>
    </div>

    <div id="adminRounds" class="admin-rounds"></div>

    <button id="saveAll" class="save-all">Save 8 Rounds</button>
    <p id="saveMsg"></p>
  </section>
</main>
<script src="/admin.js?v=6.15"></script>
</body>
</html>
