<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Tartay 2D History</title><link rel="stylesheet" href="/app.css"><style>.history-app{width:min(100%,560px);margin:auto;min-height:100vh;padding:18px 14px 40px}.history-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.history-top h1{margin:0;font-size:25px}.history-top h1 span{color:#ffc928}.back{padding:10px 13px;border-radius:12px;background:#10233e;border:1px solid #284c76;color:#fff;text-decoration:none;font-weight:750}.filters{display:flex;gap:8px;margin-bottom:14px}.filters input,.filters button{min-height:42px;border-radius:11px;border:1px solid #284c76;background:#0c2039;color:#fff;padding:0 10px}.filters input{flex:1}.filters button{color:#ffc928;font-weight:800}.date-block{margin:18px 0}.date-title{font-size:14px;color:#9eb6ce;font-weight:800;margin:0 0 7px 3px}.history-message{text-align:center;color:#91aac3;padding:32px}.history-table{border:1px solid #203d60;border-radius:14px;overflow:hidden;background:#0b1c32}.history-head,.history-row{display:grid;grid-template-columns:1.08fr 1fr 1.15fr .68fr;align-items:center;text-align:center}.history-head{min-height:27px;background:#03070d;color:#778da5;font-size:11px;font-weight:800}.history-row{min-height:51px;border-top:1px solid #173350;padding:3px 6px}.history-row .time{font-size:12px;font-weight:800}.history-row .set,.history-row .value{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-row .result{font-size:23px;font-weight:900;color:#ffc928}</style></head><body><main class="history-app"><header class="history-top"><h1>Tartay <span>2D</span> History</h1><a class="back" href="/">← Home</a></header><div class="filters"><input id="historyDate" type="date"><button id="loadBtn">View</button></div><div id="historyContent"><div class="history-message">Loading history...</div></div></main><script>
const ROUNDS=["05:00 PM","06:00 PM","07:00 PM","08:00 PM","09:00 PM","10:00 PM","11:00 PM","12:00 AM"],box=document.getElementById('historyContent'),dateInput=document.getElementById('historyDate');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtDate(s){const d=new Date(s+'T00:00:00');return new Intl.DateTimeFormat('en-US',{weekday:'short',year:'numeric',month:'long',day:'numeric'}).format(d)}function group(rows){const g={};for(const x of rows){(g[x.result_date]??=[]).push(x)}return g}function render(rows){const g=group(rows),dates=Object.keys(g).sort().reverse();if(!dates.length){box.innerHTML='<div class="history-message">No results yet.</div>';return}box.innerHTML=dates.map(date=>{const m=new Map(g[date].map(x=>[x.round_time,x]));return `<section class="date-block"><div class="date-title">${esc(fmtDate(date))}</div><div class="history-table"><div class="history-head"><span>Time</span><span>Set</span><span>Value</span><span>2D</span></div>${ROUNDS.map(t=>{const x=m.get(t);return `<div class="history-row"><span class="time">${t}</span><span class="set">${esc(x?.set_value||'--')}</span><span class="value">${esc(x?.value_value||'--')}</span><span class="result">${esc(x?.result_2d||'--')}</span></div>`}).join('')}</div></section>`}).join('')}async function load(){try{const q=dateInput.value?`?date=${encodeURIComponent(dateInput.value)}&days=14&limit=500`:'?limit=500';const r=await fetch('/api/results/history'+q,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'History error');render(d.results||[])}catch(e){box.innerHTML='<div class="history-message">Unable to load history.</div>'}}document.getElementById('loadBtn').onclick=load;load();setInterval(()=>{if(document.visibilityState==='visible')load()},15000);
</script></body></html>
