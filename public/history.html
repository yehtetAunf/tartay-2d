<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result History</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header><a href="/" style="color:white;text-decoration:none">‹</a><b>Result History</b><span></span></header><input id="date" type="date" style="width:100%;padding:14px;border-radius:12px;background:#081127;color:white;border:1px solid #26365d"><section id="grid" class="grid" style="margin-top:12px"></section></main><script>let d=document.querySelector('#date'),g=document.querySelector('#grid');d.value=new Date().toISOString().slice(0,10);async function l(){let x=await fetch('/api/history?date='+d.value).then(r=>r.json());g.innerHTML=x.rounds.length?x.rounds.map(r=>`<div class="card"><span>${r.time}</span><b>${r.result}</b></div>`).join(''):'<p>No results.</p>'}d.onchange=l;l()</script></body></html>
