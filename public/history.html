<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tartay 2D History</title>

<link rel="stylesheet" href="/app.css">

<style>
body{
  margin:0;
  background:#07172a;
  color:#fff;
  font-family:Arial,sans-serif;
}

.history-app{
  width:94%;
  max-width:650px;
  margin:auto;
  padding:24px 0 40px;
}

/* HEADER */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:30px;
}

.back{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:#172b49;
  color:#fff;
  text-decoration:none;
  font-size:30px;
}

.title{
  flex:1;
  margin-left:16px;
  font-size:27px;
  font-weight:700;
}

.title span{
  color:#ffc21c;
}

.home-btn{
  padding:14px 18px;
  border-radius:14px;
  background:#172b49;
  color:#ffc21c;
  text-decoration:none;
  font-weight:bold;
}

/* DATE */

.date-title{
  font-size:18px;
  font-weight:bold;
  margin:22px 0 14px;
  color:#fff;
}

/* ROUND CARD */

.round-card{
  margin-bottom:14px;
  border-radius:16px;
  overflow:hidden;
  background:#fff;
}

.card-head{
  display:grid;
  grid-template-columns:1.2fr 1fr 1.2fr .7fr;
  background:#000;
  color:#aaa;
  padding:8px 12px;
  text-align:center;
  font-weight:bold;
}

.card-row{
  display:grid;
  grid-template-columns:1.2fr 1fr 1.2fr .7fr;
  align-items:center;
  min-height:70px;
  color:#081426;
  text-align:center;
}

.time{
  font-weight:bold;
  font-size:17px;
}

.set,
.value{
  font-weight:bold;
  font-size:15px;
}

.result{
  margin:5px;
  padding:10px 4px;
  border-radius:13px;
  background:#f0f0f0;
  font-size:30px;
  font-weight:bold;
}

.waiting{
  color:#ffc21c;
}

.message{
  text-align:center;
  padding:30px;
  color:#9fb0c6;
}

@media(max-width:420px){

  .history-app{
    width:96%;
  }

  .title{
    font-size:23px;
  }

  .home-btn{
    padding:12px;
    font-size:14px;
  }

  .card-head,
  .card-row{
    grid-template-columns:1.15fr 1fr 1.2fr .7fr;
  }

  .time{
    font-size:15px;
  }

  .set,
  .value{
    font-size:13px;
  }

  .result{
    font-size:26px;
  }
}
</style>
</head>

<body>

<main class="history-app">

  <header class="top">

    <a href="/" class="back">‹</a>

    <div class="title">
      Tartay <span>2D</span>
    </div>

    <a href="/" class="home-btn">
      Home
    </a>

  </header>


  <div id="historyContent">
    <div class="message">
      Loading history...
    </div>
  </div>

</main>


<script>

const ROUNDS = [
  "05:00 PM",
  "06:00 PM",
  "07:00 PM",
  "08:00 PM",
  "09:00 PM",
  "10:00 PM",
  "11:00 PM",
  "12:00 AM"
];


function formatDate(dateString){

  const date =
    new Date(dateString + "T00:00:00");

  return date.toLocaleDateString(
    "en-US",
    {
      weekday:"short",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function createRoundCard(
  round,
  item
){

  const result =
    item?.result_2d || "--";

  const setValue =
    item?.set_value || "--";

  const valueValue =
    item?.value_value || "--";


  const waitingClass =
    result === "--"
      ? " waiting"
      : "";


  return `
    <section class="round-card">

      <div class="card-head">

        <div>Time</div>
        <div>Set</div>
        <div>Value</div>
        <div>2D</div>

      </div>


      <div class="card-row">

        <div class="time">
          ${escapeHtml(round)}
        </div>

        <div class="set">
          ${escapeHtml(setValue)}
        </div>

        <div class="value">
          ${escapeHtml(valueValue)}
        </div>

        <div class="result${waitingClass}">
          ${escapeHtml(result)}
        </div>

      </div>

    </section>
  `;
}


async function loadHistory(){

  const container =
    document.getElementById(
      "historyContent"
    );


  try{

    const response =
      await fetch(
        "/api/results/history?limit=500",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "History load failed"
      );

    }


    const results =
      Array.isArray(data.results)
        ? data.results
        : [];


    /*
      GROUP RESULTS BY DATE
    */

    const groups = {};


    for(const item of results){

      if(!item.result_date){
        continue;
      }

      if(!groups[item.result_date]){
        groups[item.result_date] = {};
      }

      groups[item.result_date][
        item.round_time
      ] = item;
    }


    /*
      If database has no history
    */

    const dates =
      Object.keys(groups)
        .sort()
        .reverse();


    if(dates.length === 0){

      container.innerHTML = `
        <div class="message">
          No history yet.
        </div>
      `;

      return;
    }


    let html = "";


    for(const date of dates){

      html += `
        <div class="date-title">
          ${escapeHtml(
            formatDate(date)
          )}
        </div>
      `;


      /*
        ALWAYS SHOW ALL 8 ROUNDS
      */

      for(const round of ROUNDS){

        const item =
          groups[date][round] ||
          null;


        html +=
          createRoundCard(
            round,
            item
          );

      }

    }


    container.innerHTML = html;


  }catch(error){

    console.error(error);

    container.innerHTML = `
      <div class="message">
        History ကို ရယူ၍မရပါ။
      </div>
    `;

  }

}


loadHistory();

</script>

</body>
  </html>
