<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2D History</title>
<link rel="stylesheet" href="/app.css?v=6.33">
<style>
body.history-new{background:radial-gradient(circle at 50% 18%,#082354 0,#031633 42%,#001021 100%);min-height:100vh;color:#fff}
.hwrap{max-width:980px;margin:auto;padding:26px 28px 48px}
.htop{display:grid;grid-template-columns:92px 1fr 92px;align-items:center}
.htitle{text-align:center;font-size:48px;font-weight:800}
.hicon{width:76px;height:76px;border:2px solid #174c9c;border-radius:50%;background:#061a3a;color:#fff;font-size:42px}
.hicon.cal{border-color:#11c8ff;box-shadow:0 0 18px #00aef0}
.datebar{margin:22px auto 26px;padding:10px 20px;border-radius:18px;width:82%;box-sizing:border-box;background:linear-gradient(135deg,#0756c8,#053b9d);font-size:28px;font-weight:800;display:flex;gap:16px;align-items:center}
.datebar span:first-child{font-size:26px}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:46px 38px}
.round{text-align:center}.rtime{font-size:28px;font-weight:800;line-height:1.15;min-height:66px;display:flex;align-items:center;justify-content:center;white-space:pre-line}
.rbox{margin:12px auto 0;width:82%;aspect-ratio:1/1;border-radius:25px;border:2px solid #1689ff;background:linear-gradient(145deg,#1173df,#07327e);box-shadow:inset 0 0 20px rgba(22,204,255,.3),0 0 12px rgba(0,133,255,.25);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800}
.history-section{margin-bottom:52px}.history-section .datebar{margin-bottom:30px}.hnote{margin-top:20px;border-radius:38px;background:rgba(7,49,105,.72);padding:20px;text-align:center;font-size:23px}
@media(max-width:700px){.hwrap{padding:20px 16px 36px}.htop{grid-template-columns:64px 1fr 64px}.htitle{font-size:34px}.hicon{width:56px;height:56px;font-size:30px}.datebar{font-size:20px;padding:9px 15px;border-radius:14px;width:82%}.hgrid{gap:28px 16px}.rtime{font-size:19px;min-height:48px}.rbox{width:78%;font-size:32px;border-radius:16px}.hnote{font-size:16px;margin-top:38px}}

/* v6.31 History copy protection */
.history-new, .history-new * {
  -webkit-user-select:none !important;
  user-select:none !important;
  -webkit-touch-callout:none !important;
}
</style>
</head>
<body class="history-new">
<main class="hwrap">
  <div class="htop">
    <button class="hicon" onclick="location.href='/'">‹</button>
    <div class="htitle">2D History</div>
    <button class="hicon cal" id="calBtn">▣</button>
  </div>
  <input id="datePick" type="date" hidden>
  <div id="historySections"></div>
  <div class="hnote">🛡️ &nbsp; Results are final and will be held for 2 minutes.</div>
</main>
<script src="/history.js?v=6.33"></script>
<script>
/* v6.31 History copy protection */
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
</script></body>
</html>
